<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head(title='Scroom - Backlog')}"></head>

<body>

    <div class="overlay" onclick="toggleSidebar()"></div>

    <nav th:replace="~{fragments :: sidebar(activePage='backlog')}"></nav>

    <div class="header">
        <div class="header-left">
            <button class="hamburger-btn" onclick="toggleSidebar()">&#9776;</button>
            <h1>Backlog</h1>
        </div>
        <button class="add-btn" hx-get="/stories/form?view=backlog" hx-target="#modal-content"
            hx-on::after-request="document.getElementById('create-modal').showModal()">+</button>
    </div>

    <div class="container">
        <div id="backlog-list" class="backlog-list">
            <th:block th:each="story : ${stories}">
                <div th:replace="~{fragments :: backlogItem(story=${story}, oobTarget=null)}"></div>
            </th:block>

            <div th:if="${#lists.isEmpty(stories)}" class="empty-state">
                <p>No stories in backlog.</p>
            </div>
        </div>
    </div>

    <dialog id="create-modal">
        <div id="modal-content">
            <!-- Form will be injected here via HTMX -->
        </div>
    </dialog>
</body>

</html>
