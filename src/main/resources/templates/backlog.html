<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head(title='Go Do It - Backlog')}"></head>

<body>

    <div class="overlay" onclick="toggleSidebar()"></div>

    <nav th:replace="~{fragments :: sidebar(activePage='backlog')}"></nav>

    <div
        th:replace="~{fragments :: header(title='Backlog', activePage='backlog', addButtonUrl='/stories/form?view=backlog')}">
    </div>

    <div class="container">
        <div id="backlog-list" class="backlog-list">
            <th:block th:each="story : ${stories}">
                <div th:replace="~{fragments :: backlogItem(story=${story}, oobTarget=null)}"></div>
            </th:block>

            <div th:if="${#lists.isEmpty(stories)}" class="empty-state">
                <p>No stories in backlog.</p>
            </div>
        </div>
    </div>

    <dialog id="create-modal">
        <div id="modal-content">
            <!-- Form will be injected here via HTMX -->
        </div>
    </dialog>
</body>

</html>
