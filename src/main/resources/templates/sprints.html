<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head(title='Go Do It - Sprints')}"></head>

<body>

    <div class="overlay" onclick="toggleSidebar()"></div>

    <nav th:replace="~{fragments :: sidebar(activePage='sprints')}"></nav>

    <div class="header">
        <div class="header-left">
            <button class="hamburger-btn" onclick="toggleSidebar()">&#9776;</button>
            <h1>Sprints</h1>
        </div>
        <button class="add-btn" hx-get="/sprints/form" hx-target="#modal-content"
            hx-on::after-request="document.getElementById('create-modal').showModal()">+</button>
    </div>

    <div class="container" style="padding: 20px; max-width: 800px; margin: 0 auto;">
        <div id="sprint-list" class="sprint-list" th:replace="~{fragments :: sprintList(sprints=${sprints})}">
            <!-- Content replaced by fragment -->
        </div>
    </div>

    <dialog id="create-modal">
        <div id="modal-content">
            <!-- Form will be injected here via HTMX -->
        </div>
    </dialog>
</body>

</html>
