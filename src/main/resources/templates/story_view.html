<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head(title=${story.title})}"></head>

<body>

    <div class="overlay" onclick="toggleSidebar()"></div>

    <nav th:replace="~{fragments :: sidebar(activePage='board')}"></nav>

    <!-- Custom Header logic for title truncation could be done by passing class, but fragments header is simple. 
         We will use inline style or ensure global CSS handles it. 
         For now, we use the standard header. -->
    <div th:replace="~{fragments :: header(title=${story.title}, activePage='board', addButtonUrl=null)}"></div>

    <div class="main-content" style="max-width: 800px; margin: 0 auto; padding-top: 20px;">
        <style>
            .header h1 {
                display: -webkit-box;
                -webkit-line-clamp: 2;
                line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
                white-space: normal;
            }
        </style>

        <form style="background: #2d2d2d; padding: 20px; border-radius: 8px;">
            <!-- Fields -->
            <div th:replace="~{fragments :: storyFields(story=${story}, activeSprints=${activeSprints})}"></div>

            <!-- Save Button -->
            <div class="btn-group" style="margin-top: 20px;">
                <button type="submit" class="primary" th:hx-put="@{/stories/{id}(id=${story.id})}" hx-swap="none"
                    hx-on::after-request="if(event.detail.successful) { Swal.fire({ icon: 'success', title: 'Saved', toast: true, position: 'bottom-end', showConfirmButton: false, timer: 3000 }); } else { Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to save', toast: true, position: 'bottom-end', showConfirmButton: false, timer: 3000 }); }">Save</button>
            </div>

            <!-- Comments Section -->
            <div style="margin-top: 30px; border-top: 1px solid #444; padding-top: 20px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <h3 style="margin: 0;">Comments</h3>
                    <button type="button" class="add-btn" style="font-size: 1.2em; padding: 0 10px;"
                        th:hx-get="@{/stories/{id}/comments/form(id=${story.id})}" hx-target="#comment-modal-content"
                        hx-on::after-request="document.getElementById('comment-modal').showModal()">+</button>
                </div>

                <div id="comment-list"
                    style="max-height: 400px; overflow-y: auto; border: 1px solid #444; border-radius: 4px; padding: 10px; background: #222;">
                    <div th:replace="~{fragments :: commentList(story=${story})}"></div>
                </div>
            </div>
        </form>
    </div>

    <!-- Comment Modal for Adding Comments -->
    <dialog id="comment-modal">
        <div id="comment-modal-content">
            <!-- Comment Form injected here -->
        </div>
    </dialog>
    <!-- We also need create-modal if any other interactions trigger it, but for this page mostly comment modal is needed. 
         However, delete buttons in comments triggers Swal which might target 'create-modal' in the original code? 
         Let's check fragments.html comment delete button.
         It targets 'closest .comment-box'. Swal target is 'document.getElementById('create-modal')'.
         Wait, line 207: `target: document.getElementById('create-modal')`.
         If 'create-modal' doesn't exist, Swal might fail or default to body.
         Better to include it or change target. Since we reuse the fragment, we should have the modal present.
    -->
    <dialog id="create-modal" style="display: none;"></dialog>

</body>

</html>
